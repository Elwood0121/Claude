<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Listening Library</title>
<meta name="description" content="Free classic audiobooks, read by LibriVox volunteers.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Listening Library">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)">
<style>
/* Layout: library grid of type-only covers -> book page with chapter list; a player bar stays pinned to the bottom. System fonts only. */
:root {
  --bg: #fafaf8; --surface: #ffffff; --ink: #1c2229; --muted: #5f6b76; --line: #e3e5e6; --accent: #2a5b8c; --on-accent: #ffffff;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171b; --surface: #1c2026; --ink: #e4e6e8; --muted: #9aa4ad; --line: #2c3239; --accent: #8db8e3; --on-accent: #0e1a26; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #14171b; --surface: #1c2026; --ink: #e4e6e8; --muted: #9aa4ad; --line: #2c3239; --accent: #8db8e3; --on-accent: #0e1a26; color-scheme: dark }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none }
@media (display-mode: standalone) { body { padding-top: env(safe-area-inset-top) } .player button, .play, ol.chs button { -webkit-user-select: none; user-select: none } }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans);
  padding: 0 max(16px, env(safe-area-inset-left)) calc(100px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right)) }
a { color: var(--accent) }
button, input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1040px; margin: 0 auto }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 28px 0 20px }
.brand { font: 600 26px/1 var(--serif); letter-spacing: -.01em; color: var(--ink); text-decoration: none }
.brand small { display: block; font: 13px var(--sans); color: var(--muted); letter-spacing: 0; margin-top: 6px }
#q { width: min(280px, 100%); padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.continue { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--ink) }
.continue span { color: var(--muted); font-size: 13px }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 20px }
.book { text-decoration: none; color: var(--ink); display: grid; gap: 10px; align-content: start }
.cover { aspect-ratio: 1; max-width: 100%; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;
  color: #fff; background: linear-gradient(160deg, hsl(var(--h) 40% 34%), hsl(var(--h) 45% 22%)); box-shadow: 0 1px 2px rgb(0 0 0 / .15); transition: transform .15s }
.cover { position: relative; overflow: hidden }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: hsl(var(--h) 40% 30%) }
.book:hover .cover { transform: translateY(-3px) }
.cover b { font: 600 18px/1.15 var(--serif); text-wrap: balance }
.cover i { font: 11px var(--sans); font-style: normal; opacity: .85; letter-spacing: .05em; text-transform: uppercase }
.meta { font-size: 13px; color: var(--muted); line-height: 1.35 }
.meta strong { display: block; color: var(--ink); font-weight: 600; font-size: 14px }
.empty { color: var(--muted); padding: 40px 0 }
footer.note { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px }

/* book page */
.back { display: inline-block; margin: 8px 0 12px; padding: 12px 0; text-decoration: none; font-size: 14px }
.hero { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: end; margin-bottom: 28px }
.hero .cover { cursor: default } .hero .cover b { font-size: 24px }
.hero h1 { font: 600 32px/1.15 var(--serif); margin: 0 0 6px; text-wrap: balance }
.hero p { margin: 0 0 4px; color: var(--muted) }
.play { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer }
@media (max-width: 560px) { .hero { grid-template-columns: 120px minmax(0, 1fr); gap: 16px } .hero h1 { font-size: 22px } .hero .cover b { font-size: 15px } }
ol.chs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line) }
ol.chs button { width: 100%; display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  min-height: 48px; padding: 12px 6px; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer }
ol.chs button:hover { background: var(--surface) }
ol.chs .n, ol.chs .d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums }
ol.chs .on { color: var(--accent); font-weight: 600 }
ol.chs .on .n { color: var(--accent) }

/* player: a mini bar at the bottom, and a full-screen Now Playing sheet like the iPhone's own audio apps */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 90%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(20px); backdrop-filter: saturate(1.6) blur(20px); border-top: 1px solid var(--line);
  padding: 8px max(12px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)) }
.bar-prog { position: absolute; top: -1px; left: 0; height: 2px; width: 0; background: var(--accent) }
.player .in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 8px }
.now { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer }
.thumb { width: 44px; height: 44px; flex: none; border-radius: 6px; object-fit: cover; background: var(--line) }
.now .tx { min-width: 0 }
.now b, .now .tx span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.now b { font-size: 15px; font-weight: 600 } .now .tx span { font-size: 13px; color: var(--muted) }
.ctl { display: flex; align-items: center; gap: 2px }
.ctl button { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; background: none; border: 0; border-radius: 999px; cursor: pointer }
.ctl .pp { background: var(--accent); color: var(--on-accent) }
svg { width: 24px; height: 24px; fill: currentColor; display: block }

.np { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top) + 4px) max(24px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 20px) max(24px, env(safe-area-inset-left));
  transform: translateY(100%); visibility: hidden; transition: transform .35s cubic-bezier(.2, .8, .2, 1), visibility 0s .35s }
.np.open { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.2, .8, .2, 1), visibility 0s }
.grab { align-self: stretch; display: flex; justify-content: center; padding: 10px 0 14px; background: none; border: 0; cursor: pointer }
.grab i { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line) }
.np .in2 { width: 100%; max-width: 400px; display: grid; gap: 22px; margin-block: auto }
.np .art { width: min(100%, 44vh, 44dvh); justify-self: center }
.np .art .cover { border-radius: 12px; box-shadow: 0 14px 40px rgb(0 0 0 / .28) } .np .art .cover b { font-size: 28px }
.np h2 { font: 600 22px/1.2 var(--serif); margin: 0; text-wrap: balance }
.np .sub { margin: 4px 0 0; color: var(--muted); font-size: 15px }
.np input[type=range] { width: 100%; margin: 0; accent-color: var(--accent) }
.times { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.big { display: flex; justify-content: space-between; align-items: center }
.big button { width: 56px; height: 56px; display: grid; place-items: center; padding: 0; background: none; border: 0; border-radius: 999px; cursor: pointer }
.big svg { width: 30px; height: 30px }
.big .pp { width: 76px; height: 76px; background: var(--accent); color: var(--on-accent) } .big .pp svg { width: 36px; height: 36px }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.opts button { min-height: 44px; padding: 6px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums }
.opts button.on { border-color: var(--accent); color: var(--accent) }
@media (prefers-reduced-motion: reduce) { .np, .np.open { transition: none } }
@media (prefers-reduced-motion: reduce) { .cover { transition: none } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="player" id="player" hidden>
  <i class="bar-prog" id="bar-prog"></i>
  <div class="in">
    <button class="now" id="now" aria-label="Open Now Playing"><img class="thumb" id="thumb" alt=""><span class="tx"><b id="now-t"></b><span id="now-c"></span></span></button>
    <div class="ctl">
      <button data-act="back" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" font-size="7" text-anchor="middle" font-family="sans-serif" font-weight="700">15</text></svg></button>
      <button class="pp" data-act="toggle" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button data-act="fwd" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" font-size="7" text-anchor="middle" font-family="sans-serif" font-weight="700">30</text></svg></button>
    </div>
  </div>
</div>

<div class="np" id="np" role="dialog" aria-modal="true" aria-label="Now Playing" aria-hidden="true">
  <button class="grab" id="np-close" aria-label="Close Now Playing"><i></i></button>
  <div class="in2">
    <div class="art" id="np-art"></div>
    <div><h2 id="np-t"></h2><p class="sub" id="np-c"></p></div>
    <div>
      <input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="Position in chapter">
      <div class="times"><span id="cur">0:00</span><span id="left">-0:00</span></div>
    </div>
    <div class="big">
      <button data-act="prev" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button data-act="back" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" font-size="7" text-anchor="middle" font-family="sans-serif" font-weight="700">15</text></svg></button>
      <button class="pp" data-act="toggle" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button data-act="fwd" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" font-size="7" text-anchor="middle" font-family="sans-serif" font-weight="700">30</text></svg></button>
      <button data-act="next" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="opts">
      <button id="speed" aria-label="Playback speed">1×</button>
      <button id="sleep" aria-label="Sleep timer">Sleep</button>
      <button id="np-chs">Chapters</button>
    </div>
  </div>
</div>
<audio id="audio" preload="none"></audio>

<script>
(() => {
  const $ = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const k in a) k === "class" ? e.className = a[k] : k.startsWith("on") ? e[k] = a[k] : e.setAttribute(k, a[k]); e.append(...kids); return e; };
  const byId = id => document.getElementById(id);
  const store = { get(k, d) { try { const v = localStorage.getItem("os-" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                  set(k, v) { try { localStorage.setItem("os-" + k, JSON.stringify(v)); } catch {} } };
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
  const hm = s => { const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };
  // Each LibriVox file opens with a spoken notice. books.json stores where it ends (4th value); the player
  // starts there and counts time from that point, so the notice never plays or shows.
  const off = (b, i) => b.ch[i][3] || 0;
  const len = c => c[2] - (c[3] || 0);
  const total = b => b.ch.reduce((t, c) => t + len(c), 0);
  // Cover art streams from archive.org; the colored title box underneath shows if the picture can't load.
  // Full-size cover from archive.org; falls back to archive.org's small thumbnail, then to the colored title box.
  const thumbUrl = b => `https://archive.org/services/img/${b.ia}`;
  const coverUrl = b => b.cover ? `https://archive.org/download/${b.ia}/${encodeURIComponent(b.cover)}` : thumbUrl(b);
  const cover = b => $("div", { class: "cover", style: "--h:" + b.hue }, $("b", {}, b.title), $("i", {}, b.author),
    $("img", { src: coverUrl(b), alt: "", loading: "lazy", decoding: "async",
      onerror: e => { const img = e.target; img.src !== thumbUrl(b) ? img.src = thumbUrl(b) : img.remove(); } }));
  const app = byId("app"), audio = byId("audio");
  let catalog = [], cur = null; // cur = { b, i }

  /* ---------- views ---------- */
  function library() {
    document.title = "The Listening Library";
    const q = $("input", { id: "q", type: "search", placeholder: "Search title or author", "aria-label": "Search audiobooks" });
    const grid = $("div", { class: "grid" });
    const draw = () => {
      const s = q.value.trim().toLowerCase();
      const list = catalog.filter(b => (b.title + " " + b.author).toLowerCase().includes(s));
      grid.replaceChildren(...list.map(b => $("a", { class: "book", href: "#" + b.id }, cover(b),
        $("div", { class: "meta" }, $("strong", {}, b.title), `${b.author} · ${hm(total(b))}`))));
      if (!list.length) grid.append($("p", { class: "empty" }, catalog.length ? "No audiobooks match that search." : "Could not load the library. Refresh to try again."));
    };
    q.oninput = draw; draw();
    const last = store.get("last", null), lb = last && catalog.find(b => b.id === last.id);
    app.replaceChildren(
      $("header", { class: "top" }, $("a", { class: "brand", href: "#" }, "The Listening Library", $("small", {}, `${catalog.length} free classic audiobooks`)), q),
      ...(lb ? [$("a", { class: "continue", href: "#" + lb.id }, "Continue listening:", $("strong", {}, lb.title), $("span", {}, lb.ch[last.i][0]))] : []),
      grid,
      $("footer", { class: "note" }, "Recordings by volunteer narrators at LibriVox (librivox.org), streamed from the Internet Archive (archive.org). All recordings and books are in the public domain."));
  }

  function bookPage(b) {
    document.title = `${b.title} · The Listening Library`;
    const saved = store.get("pos", {})[b.id];
    const startAt = saved ? saved.i : 0;
    const list = $("ol", { class: "chs" }, ...b.ch.map((c, i) => $("li", {}, $("button", { "data-i": i, onclick: () => play(b, i, 0) },
      $("span", { class: "n" }, i + 1), $("span", {}, c[0]), $("span", { class: "d" }, fmt(len(c)))))));
    app.replaceChildren(
      $("a", { class: "back", href: "#" }, "← All audiobooks"),
      $("div", { class: "hero" }, cover(b), $("div", {},
        $("h1", {}, b.title),
        $("p", {}, `${b.author}, ${b.year}`),
        $("p", {}, `Read by ${b.reader} · ${b.ch.length} parts · ${hm(total(b))}`),
        $("button", { class: "play", onclick: () => cur && cur.b === b ? toggle() : play(b, startAt, saved ? saved.t : 0) },
          saved ? `▶ Resume ${b.ch[startAt][0]}` : "▶ Play from the start"))),
      list);
    mark();
    scrollTo(0, 0);
  }

  function mark() {
    document.querySelectorAll("ol.chs button").forEach(el => el.classList.toggle("on", !!cur && location.hash.slice(1) === cur.b.id && +el.dataset.i === cur.i));
  }

  /* ---------- player ---------- */
  const ICON = { play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', pause: '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' };
  const art = coverUrl;
  const speed = () => store.get("speed", 1);
  const o = () => cur ? off(cur.b, cur.i) : 0;
  let pending = null, dragging = false, lastSave = 0;

  function show(b, i, t) {
    byId("player").hidden = false;
    byId("thumb").src = art(b);
    byId("now-t").textContent = b.title;
    byId("now-c").textContent = b.ch[i][0];
    byId("np-t").textContent = b.title;
    byId("np-c").textContent = `${b.ch[i][0]} · read by ${b.reader}`;
    const a = byId("np-art");
    if (a.dataset.id !== b.id) { a.replaceChildren(cover(b)); a.dataset.id = b.id; }
    byId("seek").max = len(b.ch[i]);
    progress(t - off(b, i));
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({
      title: b.ch[i][0], artist: b.author, album: b.title, artwork: [{ src: art(b), sizes: "512x512", type: "image/jpeg" }] });
  }
  function progress(pos) {
    const dur = cur ? len(cur.b.ch[cur.i]) : 0;
    if (!dragging) byId("seek").value = Math.floor(pos);
    byId("cur").textContent = fmt(pos);
    byId("left").textContent = "-" + fmt(dur - pos);
    byId("bar-prog").style.width = (dur ? Math.min(100, Math.max(0, pos / dur * 100)) : 0) + "%";
  }
  function load(b, i, t, autoplay) {
    cur = { b, i };
    const startAt = Math.max(t || 0, off(b, i));
    pending = startAt;
    audio.src = `https://archive.org/download/${b.ia}/${encodeURIComponent(b.ch[i][1])}`;
    audio.addEventListener("loadedmetadata", () => { audio.currentTime = startAt; audio.playbackRate = speed(); pending = null; }, { once: true });
    show(b, i, startAt);
    if (autoplay) audio.play().catch(() => {});
    save(); mark();
  }
  const play = (b, i, t) => load(b, i, t, true);
  const toggle = () => audio.paused ? audio.play().catch(() => {}) : audio.pause();
  const skip = s => { if (pending == null) audio.currentTime = Math.max(o(), Math.min((audio.duration || 1e9) - 1, audio.currentTime + s)); };
  const step = d => { if (cur && cur.b.ch[cur.i + d]) play(cur.b, cur.i + d, 0); };
  function save() {
    if (!cur) return;
    const pos = store.get("pos", {}); pos[cur.b.id] = { i: cur.i, t: Math.floor(pending ?? audio.currentTime ?? 0) };
    store.set("pos", pos); store.set("last", { id: cur.b.id, i: cur.i });
  }

  // Sleep timer: off -> 15/30/45/60 minutes -> end of chapter -> off
  const SLEEP = [0, 15, 30, 45, 60, "ch"];
  let sleep = 0, sleepAt = 0;
  function setSleep(v) { sleep = v; sleepAt = typeof v === "number" && v ? Date.now() + v * 60000 : 0; sleepLabel(); }
  function sleepLabel() {
    const el = byId("sleep");
    el.textContent = !sleep ? "Sleep" : sleep === "ch" ? "End of chapter" : "Sleep " + fmt((sleepAt - Date.now()) / 1000);
    el.classList.toggle("on", !!sleep);
  }
  byId("sleep").onclick = () => setSleep(SLEEP[(SLEEP.indexOf(sleep) + 1) % SLEEP.length]);
  setInterval(() => { if (sleepAt) { if (Date.now() >= sleepAt) { audio.pause(); setSleep(0); } else sleepLabel(); } }, 1000);

  const setPP = playing => document.querySelectorAll(".pp").forEach(b => { b.innerHTML = playing ? ICON.pause : ICON.play; b.setAttribute("aria-label", playing ? "Pause" : "Play"); });
  audio.addEventListener("play", () => { audio.playbackRate = speed(); setPP(true); });
  audio.addEventListener("pause", () => { setPP(false); save(); });
  audio.addEventListener("ended", () => { if (sleep === "ch") { setSleep(0); save(); return; } step(1); });
  audio.addEventListener("timeupdate", () => {
    if (pending != null) return;
    progress(audio.currentTime - o());
    if (Date.now() - lastSave > 5000) {
      lastSave = Date.now(); save();
      try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime }); } catch {}
    }
  });
  audio.addEventListener("error", () => { if (cur) byId("now-c").textContent = byId("np-c").textContent = "This chapter could not load. Check your connection and try again."; });
  byId("seek").addEventListener("input", e => { dragging = true; progress(+e.target.value); });
  byId("seek").addEventListener("change", e => { dragging = false; if (pending == null) audio.currentTime = +e.target.value + o(); else pending = +e.target.value + o(); });

  const acts = { toggle, back: () => skip(-15), fwd: () => skip(30), prev: () => step(-1), next: () => step(1) };
  document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t) acts[t.dataset.act](); });
  const showSpeed = () => byId("speed").textContent = speed() + "× speed";
  const speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];
  byId("speed").onclick = () => { const s = speeds[(speeds.indexOf(speed()) + 1) % speeds.length]; store.set("speed", s); audio.playbackRate = s; showSpeed(); };
  showSpeed();

  // Now Playing sheet: tap the mini player to open; tap the handle, swipe down or press Esc to close.
  const np = byId("np");
  function openNP() { np.classList.add("open"); np.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; byId("np-close").focus({ preventScroll: true }); }
  function closeNP() { np.classList.remove("open"); np.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }
  byId("now").onclick = openNP;
  byId("np-close").onclick = closeNP;
  byId("np-chs").onclick = () => { closeNP(); if (cur) location.hash = cur.b.id; };
  let y0 = null;
  np.addEventListener("touchstart", e => { y0 = np.scrollTop <= 0 && !e.target.closest("input") ? e.touches[0].clientY : null; }, { passive: true });
  np.addEventListener("touchend", e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closeNP(); y0 = null; });

  if ("mediaSession" in navigator) {
    const ms = navigator.mediaSession;
    const h = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
    h("play", () => audio.play()); h("pause", () => audio.pause());
    h("seekbackward", () => skip(-15)); h("seekforward", () => skip(30));
    h("previoustrack", () => step(-1)); h("nexttrack", () => step(1));
    h("seekto", d => { audio.currentTime = Math.max(o(), d.seekTime); });
  }
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && np.classList.contains("open")) return closeNP();
    if (!cur || e.target.matches("input, textarea") || e.target.closest("button")) return;
    if (e.key === " ") { e.preventDefault(); toggle(); }
    if (e.key === "ArrowLeft") skip(-15);
    if (e.key === "ArrowRight") skip(30);
  });
  addEventListener("pagehide", save);

  /* ---------- routing ---------- */
  function route() {
    const b = catalog.find(x => x.id === decodeURIComponent(location.hash.slice(1)));
    b ? bookPage(b) : library();
  }
  addEventListener("hashchange", route);
  fetch("books/books.json").then(r => r.json()).then(c => {
    catalog = c;
    // Show the last book in the player, paused, so one tap resumes it.
    const last = store.get("last", null), b = last && catalog.find(x => x.id === last.id);
    if (b) {
      const p = store.get("pos", {})[b.id] || { i: last.i, t: 0 };
      load(b, p.i, p.t, false);
    }
  }).catch(() => {}).finally(route);
})();
</script>
</body>
</html>
